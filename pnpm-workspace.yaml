packages:
  - artifacts/*
  - scripts

allowBuilds:
  esbuild: true

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.2
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.101.4
  '@types/node': ^25.9.5
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^5.2.0
  class-variance-authority: ^0.7.1
  clsx: 2.1.1
  drizzle-orm: ^0.45.1
  framer-motion: 12.35.1
  lucide-react: 0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: 3.5.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.8
  vite: ^7.3.6
  zod: ^3.25.76

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-sunos-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-win32-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-win32-x64': '-'
  # Antes fijado a 0.27.3 para blindar contra la versión vieja de esbuild que
  # traía drizzle-kit (backend eliminado, ver CHANGELOG "Removed"). Ya no hay
  # ninguna dependencia real de drizzle-kit/drizzle-orm en el repo, pero se
  # mantiene el pin como piso de versión: 0.27.3 era además la primera
  # versión vulnerable a GHSA-g7r4-m6w7-qqqr (arbitrary file read vía dev
  # server en Windows), parcheada en 0.28.1.
  esbuild: 0.28.1
